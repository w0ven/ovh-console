name: CI

# 后端（gofmt / go vet / go test -race -short / 交叉编译）与前端（单测 / tsc / vite build）自动校验。
# 联网调用 OVH 公开接口的 live-api job 仅手动触发，避免 OVH 抖动或限流干扰常规 PR / push。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 (build / vet / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt 检查
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化,请跑 gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -short 跳过需要联网打 OVH 公开接口的用例
      - name: go test (含 race)
        run: go test -race -short ./...

      # 提前验证跨平台纯 Go 编译可通过
      - name: 交叉编译五平台
        run: |
          set -e
          build() {
            echo "==> $1/$2"
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build -trimpath -o /dev/null .
          }
          build windows amd64
          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64

  frontend:
    name: 前端 (test / tsc / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 前端回归测试
        run: npm test
      - name: 构建与 TypeScript 类型检查
        run: npm run build

  live-api:
    name: OVH 公开接口契约(仅手动触发)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: 联网契约测试
        run: go test -run 'Live' -v ./internal/catalog/
